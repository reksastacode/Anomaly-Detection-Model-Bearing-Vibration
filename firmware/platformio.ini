; ==============================================================================
; ZENTRA TinyML - PlatformIO Project Configuration (Tahap 10)
; Target Board: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)
; CPU: Dual-Core Xtensa LX7 @ 240 MHz
; ==============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Hardware Memory Configuration for N16R8
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Compiler Optimizations & Preprocessor Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -O3

; Library Dependencies for TinyML & Signal Processing
lib_deps = 
    ; Official TFLM or lightweight C math
